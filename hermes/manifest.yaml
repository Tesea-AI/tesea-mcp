# Manifesto pronto para submissão ao catálogo oficial do Hermes Agent.
manifest_version: 1

name: tesea
description: Consulte processos e documentos judiciais pelo MCP oficial da Tesea.
source: https://github.com/Tesea-AI/tesea-mcp

transport:
  type: http
  url: https://api.tesea.com.br/mcp

auth:
  type: oauth

post_install: |
  Na primeira conexão, o Hermes abrirá o navegador para autenticação na Tesea.
  Para testar ou refazer o login:

    hermes mcp login tesea
    hermes mcp test tesea
